<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <fieldset>
        <legend>Cars</legend>

        <form>

            <select size="9" multiple required name="Car" id="Car">

                <option selected disabled value="">you car</option>

                <optgroup label="Sedan">
                    <option value="Subaru_WRX">Subaru WRX</option>
                    <option value="Honda_Fit">Honda Fit</option>
                    <option value="Hunday_Sonata">Hunday Sonata</option>
                </optgroup>

                <optgroup label="SUV">
                    <option value="BMW_M4">BMW M4</option>
                    <option value="BMW_M5_F90">BMW M5 F90</option>
                    <option value="BMW_M8">BMW M8</option>
                </optgroup>

                <optgroup><Label>Pickup</Label>
                    <option value="Toyota_Hilux">Toyota Hilux</option>
                    <option value="RAM_1500">RAM 1500</option>
                    <option value="Ford_F150">Ford F150</option>
                </optgroup>

                <optgroup><label>Miniven</label>
                    <option value="Toyota_Alpard">Toyota Alpard</option>
                    <option value="Hundai_Staria">Hundai Staria</option>
                    <option value="Kia_Carnival">Kia Carnival</option>
                </optgroup>

            </select>

            <br><br>

            <input checked type="checkbox" name="headphones" id="headphones">
            <label for="headphones">Headphones</label>

            <br><br>

            <button type="submit">Submit</button>
        </form>
    </fieldset>

</body>

</html>
